:root{--bg:#eef3f9;--card:#fff;--ink:#1d2b3a;--mute:#5d6e80;--line:#dbe3ec;--div:#c3cbd5;--acc:#2f6fa3;--accbg:#d9e9f7;--ok:#dcefe4;--warn:#fdf0bd;--green:#25634a;--hh:56px;--sw:260px;--hdr:#2f6fa3;--brand:'Pacifico','Brush Script MT','Segoe Script',cursive;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a23;--card:#1b2530;--ink:#e8eef5;--mute:#93a3b5;--line:#2c3947;--div:#3d4b5b;--acc:#7db6e8;--accbg:#264662;--ok:#1f3a2d;--warn:#4a3f17;--green:#7fd1ad;--hdr:#1f4a6e}}
*{box-sizing:border-box}html{scroll-padding-top:calc(var(--hh) + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
main{margin-left:var(--sw);padding:calc(var(--hh) + env(safe-area-inset-top,0px) + 18px) 16px 90px}.pg{max-width:680px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
h2{margin:0 0 12px;font-size:19px}
.sub{color:var(--mute);font-size:14px}
.card{padding:18px 0;border-top:1px solid var(--div)}.card:first-child{border-top:0;padding-top:8px}.eyebrow+.card{border-top:0;padding-top:14px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:44px;white-space:nowrap;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:center;cursor:pointer}
.chip.on{background:var(--accbg);border-color:var(--acc);font-weight:700;color:var(--acc)}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.ing{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--div);padding:12px 0;cursor:pointer}
.ing .dot{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex:none}
.ing.done{opacity:.5}.ing.done .dot{background:var(--acc);border-color:var(--acc)}
.ing b{margin-left:auto;font-size:26px}.ing small{color:var(--mute)}
.levain{background:var(--ok);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.levain .big{font-size:20px;font-weight:700;color:var(--green)}
input[type=range]{padding:0;border:0;background:none;height:34px;accent-color:var(--acc)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.g2>div{min-width:0}input[type=date],input[type=time]{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block;height:44px;line-height:1.2}

.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.s{background:none;color:var(--acc);width:auto;padding:4px 0;margin:0;font-size:13px}
.loaf{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.loaf .h{display:flex;justify-content:space-between;font-weight:700}
.stars{color:#e0a100;letter-spacing:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g3>div,.g2>div{min-width:0}
.ovb{border:1px solid var(--acc);background:var(--accbg);border-radius:12px;padding:10px 8px;text-align:center}.ovb .note{margin:0 0 6px}.ovt{display:flex;align-items:center;gap:4px}.ovt input{text-align:center;padding:8px 4px;font-weight:700;min-width:0}.ovm{font-weight:700;color:var(--acc);font-size:14px;margin-top:8px}
.sec{font-weight:700;margin-top:16px;border-top:1px solid var(--div);padding-top:14px}
.cols>div{min-width:0}
.ig{display:grid;grid-template-columns:1fr 72px 96px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--div)}.ig.hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}.ig input{padding:8px;text-align:right}
.hz{display:flex;overflow-x:auto;padding:14px 0 10px;margin:-10px -4px 0}
.hs{flex:none;width:70px;position:relative;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:0 2px;cursor:pointer;text-align:center}
.hs i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--line);background:var(--card);position:relative;z-index:1}
.hs::before{content:'';position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}.hs:first-child::before{display:none}
.hs.done i{background:var(--acc);border-color:var(--acc)}.hs.cur i{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}.hs.cur{color:var(--ink);font-weight:700}@keyframes pulse{0%{box-shadow:0 0 0 3px var(--accbg),0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 3px var(--accbg),0 0 0 12px transparent}}.hs.cur i{animation:pulse 1.8s ease-out infinite}@media (prefers-reduced-motion:reduce){.hs.cur i{animation:none}}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--green);color:#fff;font-weight:700}.tbar.due{background:#b3412b}
.tbar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit}
.bar{display:flex;gap:8px;margin-top:12px}.bar .btn{margin:0}.bar .btn.g{background:var(--mute);width:96px;flex:none}
details{margin-top:6px;font-size:13px}summary{color:var(--acc);cursor:pointer}
.who{display:flex;align-items:center;gap:12px;margin-bottom:4px}.av{position:relative;width:46px;height:46px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--hdr);color:#fff;display:flex;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#brand{width:var(--sw);flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;font-size:19px;white-space:nowrap}#brand img,.nbrand img{height:30px;width:auto}#brand span,.nbrand span{font-family:var(--brand);font-weight:400;font-size:21px;line-height:1.2;letter-spacing:.01em}
#top h1{margin:0;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px}
#mb{display:none;width:44px;height:44px;margin-left:6px;border:0;background:none;color:#fff;align-items:center;justify-content:center;cursor:pointer}#mb .ic{color:#fff;width:26px;height:26px}
#nav{position:fixed;z-index:25;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--sw);background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.nbrand{display:none}
.ni{display:flex;align-items:center;gap:16px;width:100%;padding:13px 18px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.ni:hover{background:var(--bg)}.ni.on{background:var(--accbg);font-weight:700}.ni .ic{width:24px;height:24px}.ni.on .ic{color:var(--acc)}.ni .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ni .av{width:34px;height:34px;font-size:16px}
.nh{font-size:13px;color:var(--mute);padding:18px 18px 6px;border-top:1px solid var(--line);margin-top:8px}
.ver{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px;font-size:14px}.ver small{color:var(--mute);font-size:12px}.rl{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}.rl .ic{width:22px;height:22px}
#scrim{display:none}
.lit{border-top:1px solid var(--div)}.lit:last-child{border-bottom:1px solid var(--div)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}.lrow .ld{font-weight:700;flex:1}.lrow .ic{width:20px;height:20px;color:var(--mute);transition:transform .15s}.lit.open .lrow .ic{transform:rotate(180deg)}
.lx{padding:0 4px 14px}.lx .loaf{border:0;padding:0;margin:0}.lx .loaf .h{display:none}.lx .loaf>.note:first-of-type{margin-top:10px}
.tr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--div)}.tr span:last-child{color:var(--mute);text-align:right}
.btn .ic{color:inherit}
@media (max-width:859px){main{margin-left:0}#brand{display:none}#mb{display:flex}#top h1{padding-left:6px}.nbrand{display:flex;align-items:center;gap:10px;padding:10px 18px 14px;font-weight:700;font-size:19px}#nav{transform:translateX(-102%);transition:transform .2s;width:min(300px,84vw);top:0;padding-top:calc(env(safe-area-inset-top,0px) + 6px);z-index:40}.dr #nav{transform:none;box-shadow:0 0 28px rgba(0,0,0,.35)}.dr #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}.tbar{left:0}}
@media (min-width:860px){.tbar{left:var(--sw)}}
body.out #nav,body.out #mb{display:none}body.out main{margin-left:0}body.out #brand{display:flex;width:auto}@media (min-width:860px){body.out .tbar{left:0}}
.ic{width:20px;height:20px;flex:none;color:var(--acc)}.card h2{display:flex;align-items:center;gap:8px}.card h2 .ic{width:22px;height:22px}.in{display:flex;align-items:center;gap:10px}.in .ic{width:24px;height:24px}.lbl .ic,.sec .ic{width:15px;height:15px;margin-right:6px;vertical-align:-3px}.tbar .ic{color:inherit;width:18px;height:18px;margin-right:8px}
.ovb .ovt+.ovt{margin-top:6px}
</style>
</head>

<div id="scrim" data-menu="0"></div>
