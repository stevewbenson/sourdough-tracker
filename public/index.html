<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fa3">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourdough Tracker</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--ink:#1d2b3a;--mute:#5d6e80;--line:#dbe3ec;--acc:#2f6fa3;--accbg:#d9e9f7;--ok:#dcefe4;--warn:#fdf0bd;--green:#25634a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a23;--card:#1b2530;--ink:#e8eef5;--mute:#93a3b5;--line:#2c3947;--acc:#7db6e8;--accbg:#264662;--ok:#1f3a2d;--warn:#4a3f17;--green:#7fd1ad}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{margin:4px 0 2px;font-size:32px}h1.brand{display:flex;align-items:center;gap:10px}h1.brand img{height:36px;width:auto}h2{margin:0 0 12px;font-size:19px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:44px;white-space:nowrap;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:center;cursor:pointer}
.chip.on{background:var(--accbg);border-color:var(--acc);font-weight:700;color:var(--acc)}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.ing{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.ing .dot{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex:none}
.ing.done{opacity:.5}.ing.done .dot{background:var(--acc);border-color:var(--acc)}
.ing b{margin-left:auto;font-size:26px}.ing small{color:var(--mute)}
.levain{background:var(--ok);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.levain .big{font-size:20px;font-weight:700;color:var(--green)}
input[type=range]{padding:0;border:0;background:none;height:34px;accent-color:var(--acc)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.g2>div{min-width:0}input[type=date],input[type=time]{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block;height:44px;line-height:1.2}
@media (min-width:820px){main{max-width:1120px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.s{background:none;color:var(--acc);width:auto;padding:4px 0;margin:0;font-size:13px}
.loaf{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.loaf .h{display:flex;justify-content:space-between;font-weight:700}
.stars{color:#e0a100;letter-spacing:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g3>div,.g2>div{min-width:0}
.ovb{border:1px solid var(--acc);background:var(--accbg);border-radius:12px;padding:10px 8px;text-align:center}.ovb .note{margin:0 0 6px}.ovt{display:flex;align-items:center;gap:4px}.ovt input{text-align:center;padding:8px 4px;font-weight:700;min-width:0}.ovm{font-weight:700;color:var(--acc);font-size:14px;margin-top:8px}
.sec{font-weight:700;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.cols>div{min-width:0}
.ig{display:grid;grid-template-columns:1fr 72px 96px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.ig.hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}.ig input{padding:8px;text-align:right}
.hz{display:flex;overflow-x:auto;padding:4px 0 10px;margin:0 -4px}
.hs{flex:none;width:70px;position:relative;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:0 2px;cursor:pointer;text-align:center}
.hs i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--line);background:var(--card);position:relative;z-index:1}
.hs::before{content:'';position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}.hs:first-child::before{display:none}
.hs.done i{background:var(--acc);border-color:var(--acc)}.hs.cur i{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}.hs.cur{color:var(--ink);font-weight:700}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--green);color:#fff;font-weight:700}.tbar.due{background:#b3412b}
.tbar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit}
.bar{display:flex;gap:8px;margin-top:12px}.bar .btn{margin:0}.bar .btn.g{background:var(--mute);width:96px;flex:none}
details{margin-top:6px;font-size:13px}summary{color:var(--acc);cursor:pointer}
main{padding-bottom:90px;position:relative}#gear{position:absolute;top:16px;right:14px;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);display:none;align-items:center;justify-content:center;cursor:pointer}#gear svg{width:22px;height:22px}#sp{position:absolute;top:62px;right:14px;left:14px;max-width:340px;margin-left:auto;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.2)}#sp[hidden]{display:none}h1.brand{padding-right:50px;font-size:clamp(23px,7vw,32px)}h1.brand img{height:clamp(28px,8vw,36px)}
</style>
</head>
<body>
<main>
<button id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><div id="sp" hidden></div>
<div class="eyebrow" id="eyebrow"></div>
<h1 class="brand"><img src="logo.png" alt="">Sourdough Tracker</h1>
<div class="sub" id="sub"></div>
<div class="note" id="sync"></div>
<div id="app"></div>
<div id="tbar" class="tbar" style="display:none"><span id="tt"></span><button data-tx="1">Dismiss</button></div>
</main>
<script>
var S={pre:500,cov:450,unc:450,hyd:75,batch:2,auto:60,fridge:16,fpl:475,ww:10,lev:20,salt:2,lb:0,tc:0,sn:'Yeasty Boys',run:{}};
var LOG=[];
try{var raw=localStorage.getItem('bakeboard-log');if(raw)LOG=JSON.parse(raw)||[]}catch(e){}
try{var st=localStorage.getItem('bakeboard-set');if(st){var o=JSON.parse(st);for(var k in o)if(k!=='ticks'&&k!=='notes')S[k]=o[k]}}catch(e){}
var DEL=[],STS=0,CFG={};
try{DEL=JSON.parse(localStorage.getItem('bb-del')||'[]');STS=+localStorage.getItem('bb-sts')||0;CFG=JSON.parse(localStorage.getItem('bb-gh')||'{}')}catch(e){}
function curSet(){var c={};for(var k in S)if(k!=='ticks'&&k!=='notes')c[k]=S[k];return c}
function persist(){try{localStorage.setItem('bb-sts',STS);localStorage.setItem('bb-del',JSON.stringify(DEL));localStorage.setItem('bakeboard-log',JSON.stringify(LOG));localStorage.setItem('bakeboard-set',JSON.stringify(curSet()))}catch(e){}}
function save(){STS=Date.now();persist();sched()}
function $(id){return document.getElementById(id)}
var OZ=28.3495,spDirty=false;
function dm(g){g=+g;if(!S.lb)return Math.round(g).toLocaleString()+' g';var o=g/OZ,lb=Math.floor(o/16+1e-9),r=Math.round((o-lb*16)*10)/10;if(r>=16){lb++;r=0}return lb?lb+' lb '+r+' oz':r+' oz'}
function wv(g){return S.lb?Math.round(g/OZ*100)/100:g}
function wg(v){return S.lb?Math.round(v*OZ*10)/10:v}
function wu(){return S.lb?'oz':'g'}
function tv(f){return S.tc?Math.round((f-32)*50/9)/10:f}
function tf(v){return S.tc?Math.round((v*9/5+32)*10)/10:v}
function tu(){return '°'+(S.tc?'C':'F')}
function td(f){return tv(f)+tu()}
function SN(){return (S.sn||'').trim()}
function spHtml(){return '<h2 style="margin:0 0 4px">Settings</h2><div class="lbl">Starter name</div><input id="sname" maxlength="40" placeholder="Name your starter" value="'+esc(S.sn||'')+'"><div class="lbl">Weights</div>'+chips([[0,'Grams'],[1,'Pounds &amp; ounces']],S.lb?1:0,'lb')+'<div class="lbl">Temperature</div>'+chips([[0,'°F'],[1,'°C']],S.tc?1:0,'tc')+'<div class="note">In pounds &amp; ounces, recipe boxes take ounces. Saved bakes convert automatically.</div><button class="btn" id="spx" style="margin-top:12px">Done</button>'}
document.addEventListener('click',function(e){var sp=$('sp'),g=$('gear');if(g.contains(e.target)){var o=sp.hidden;sp.hidden=!o;g.setAttribute('aria-expanded',o);if(o)sp.innerHTML=spHtml();return}if(!sp.hidden&&(e.target.id==='spx'||!sp.contains(e.target))){sp.hidden=true;g.setAttribute('aria-expanded',false)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('sp').hidden=true});
var P=null,syncing=false,again=false,stimer=null;
function p2(n){return (n<10?'0':'')+n}
function t12(x){var a=String(x).split(':'),h=+a[0],ap=h>=12?'PM':'AM';return (h%12||12)+':'+a[1]+' '+ap}
function loafOld(l){var d=new Date(l.ts),q=function(a){return a.filter(Boolean).join(' · ')},has=function(x){return x!==''&&x!=null};
 var ln=[q([l.hyd+'% hydration',l.n+' loaves',l.bake,l.auto+' min autolyse']),
  q([l.st?'Mixed '+t12(l.st):'',l.sh?'shaped '+t12(l.sh):'',has(l.bulk)?'bulk '+l.bulk+' h':'',has(l.fridge)?'fridge '+l.fridge+' h':'',has(l.rise)?'perceived rise '+l.rise+'%':'']),
  has(l.bf)?'Used: flour '+dm(l.bf)+', whole wheat '+dm(l.ww)+', water '+dm(l.w)+', levain '+dm(l.lv)+', salt '+dm(l.sa):'',
  q([has(l.temp)?'dough '+td(l.temp)+'':'',has(l.rm)?'room '+td(l.rm)+'':'']),
  q([has(l.pre)?'preheat '+td(l.pre)+'':'',has(l.cov)?'covered '+(has(l.cm)?l.cm:'?')+' min at '+td(l.cov)+'':'',has(l.unc)?'uncovered '+(has(l.um)?l.um:'?')+' min at '+td(l.unc)+'':'',has(l.it)?'internal '+td(l.it)+'':''])];
 return '<div class="loaf"><div class="h"><span>'+d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</span><span class="stars">'+'★'.repeat(l.rating)+'<span style="opacity:.3">'+'★'.repeat(5-l.rating)+'</span></span></div>'
  +ln.filter(Boolean).map(function(x){return '<div class="note">'+esc(x)+'</div>'}).join('')
  +(l.photo?'<img data-ph="'+l.photo+'" alt="Crumb photo" style="width:100%;border-radius:10px;margin-top:8px">':'')+(l.notes?'<div style="margin-top:6px;font-size:14px">'+esc(l.notes)+'</div>':'')+'<button class="btn s" data-del="'+l.id+'">Delete</button></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gh(path,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'},o.headers||{});return fetch('https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/contents/'+path,o)}
function b64(t){return btoa(unescape(encodeURIComponent(t)))}
function unb64(t){return decodeURIComponent(escape(atob(t.replace(/\n/g,''))))}
function busy(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
function msg(t){var e=$('sync');if(e)e.textContent=t}
var USER=null,FB=null,READY=false;
function sched(){clearTimeout(stimer);if(FB&&USER)stimer=setTimeout(function(){FB.pushSet(curSet(),STS)},1500)}
window.onUser=function(u,fb){FB=fb;READY=true;
 if(u){var old=null;try{old=localStorage.getItem('bb-uid')}catch(e){}
  try{localStorage.setItem('bb-uid',u.uid)}catch(e){}
  if(old&&old!==u.uid){try{['bakeboard-log','bakeboard-set','bb-sts','bb-del'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}location.reload();return}}
 USER=u;msg(u?'Signed in. Syncing automatically.':'');render()};
window.onRemoteSet=function(set,sts){if(set&&sts>STS){for(var k in set)S[k]=set[k];STS=sts;persist();if(!busy())render()}else if(STS>(sts||0)&&FB)FB.pushSet(curSet(),STS)};
window.onRemoteBakes=function(a){LOG=a.sort(function(x,y){return y.ts-x.ts});persist();if(!busy())render()};
var PH={};
function upPhoto(f){if(!f||!USER)return;var pst=$('pst');if(pst)pst.textContent='Uploading…';
 var im=new Image(),u=URL.createObjectURL(f);
 im.onload=function(){var r=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  var url=c.toDataURL('image/jpeg',.7),id=String(Date.now());
  FB.putPhoto(id,url);PH[id]=url;run().ph=id;save();render()};
 im.onerror=function(){var p=$('pst');if(p)p.textContent='Could not read that image'};im.src=u}
function loadPh(){document.querySelectorAll('img[data-ph]').forEach(function(im){if(im.getAttribute('src'))return;var id=im.dataset.ph;if(PH[id]){im.src=PH[id];return}FB&&FB.getPhoto(id).then(function(u){PH[id]=u;im.src=u}).catch(function(){})})}
function syncCard(){return '<div class="card"><h2>Account</h2><div class="note">Signed in as <b>'+esc(USER.email||USER.displayName||'')+'</b>. Your bakes and settings sync automatically.</div><button class="btn" style="background:var(--mute)" data-out="1">Sign out</button>'
 +'<details><summary>Import from the old GitHub sync</summary><div class="lbl">GitHub username</div><input id="gu" autocapitalize="none" autocorrect="off"><div class="lbl">Data repo name</div><input id="gr" value="sourdough-data" autocapitalize="none" autocorrect="off"><div class="lbl">Read-only access token</div><input id="gt" type="password" autocomplete="off"><button class="btn" data-imp="1">Import my old bakes</button><div class="note" id="imps"></div></details></div>'}
async function importOld(){var u=$('gu').value.trim(),rp=$('gr').value.trim(),tk=$('gt').value.trim(),o=$('imps');if(!u||!rp||!tk){o.textContent='Fill in all three boxes.';return}
 CFG={owner:u,repo:rp,token:tk};o.textContent='Reading old data…';
 try{var r=await gh('data.json',{cache:'no-store'});if(!r.ok)throw new Error('GitHub error '+r.status);
  var rem=JSON.parse(unb64((await r.json()).content)),del={},n=0;(rem.del||[]).forEach(function(i){del[i]=1});
  for(var l of (rem.log||[])){if(del[l.id])continue;
   if(l.photo){try{var pr=await gh('photos/'+l.photo+'.jpg',{headers:{Accept:'application/vnd.github.raw+json'}});if(pr.ok){var bl=await pr.blob(),d=await new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.readAsDataURL(bl)});FB.putPhoto(l.photo,d.replace(/^data:[^,]*/,'data:image/jpeg;base64'))}}catch(e){}}
   FB.pushBake(l);n++;o.textContent='Imported '+n+'…'}
  if(rem.set){for(var k in rem.set)if(k!=='run')S[k]=rem.set[k];save()}
  o.textContent='Done: '+n+' bakes imported. You can delete the token now.'}catch(e){o.textContent='Import problem: '+e.message}
 CFG={}}
function init(){setInterval(tick,1000);tick();setTimeout(function(){if(!READY){READY=true;render();msg('Could not load Firebase. Check firebase-config.js and your connection.')}},8000);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}
function chips(arr,cur,key,fmt){return '<div class="row">'+arr.map(function(v){return '<button class="chip'+(v[0]===cur?' on':'')+'" data-k="'+key+'" data-v="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>'}
function compute(){var n=S.batch,F=S.fpl*n,ww=Math.round(F*S.ww/100),bf=F-ww,w=Math.round(F*S.hyd/100),L=Math.round(F*S.lev/100),sl=Math.round(F*S.salt/100);var tot=F+w+L+sl;
 var st=Math.round(L/9),fw=Math.round((L-st)/2);return {n:n,F:F,ww:ww,bf:bf,w:w,L:L,sl:sl,tot:tot,per:Math.round(tot/n),st:st,fw:fw}}
function run(){return S.run||(S.run={})}
var STEPS=[{id:'lv',n:'Levain',h:'Prepare levain'},{id:'au',n:'Autolyse',h:'Autolyse'},{id:'mx',n:'Mix',h:'Mix'},{id:'f1',n:'Fold 1',h:'Stretch & fold #1'},{id:'f2',n:'Fold 2',h:'Stretch & fold #2'},{id:'c1',n:'Coil 1',h:'Coil fold #1'},{id:'c2',n:'Coil 2',h:'Coil fold #2'},{id:'bk',n:'Bulk',h:'Bulk ferment'},{id:'sh',n:'Shape',h:'Shape'},{id:'fr',n:'Fridge',h:'Into the fridge'},{id:'pre',n:'Preheat',h:'Preheat the oven'},{id:'ld',n:'Load',h:'Score and load (covered)'},{id:'lo',n:'Lids off',h:'Lids off (uncovered)'},{id:'ot',n:'Out',h:'Out of the oven'},{id:'fn',n:'Finish',h:'Finish'}];
var BTN={lv:'Levain fed',au:'Autolyse started',mx:'Mixed',f1:'Fold done',f2:'Fold done',c1:'Coil done',c2:'Coil done',bk:'Ready to shape',sh:'Shaped',fr:'In the fridge',pre:'Oven preheating',ld:'Loaded',lo:'Lids off',ot:'Out of the oven'};
var TM={mx:30,f1:30,f2:30,c1:30,pre:45,ld:20,lo:15,ot:90},TL={au:'Time to mix',mx:'Stretch & fold #1',f1:'Stretch & fold #2',f2:'Coil fold #1',c1:'Coil fold #2',pre:'Oven ready: score and load',ld:'Lids off',lo:'Check the crust',ot:'Ready to slice'};
var LBL=[['lv','Levain fed'],['au','Autolyse'],['mx','Mixed'],['f1','Fold 1'],['f2','Fold 2'],['c1','Coil 1'],['c2','Coil 2'],['bk','Shape ready'],['sh','Shaped'],['fr','Fridge'],['pre','Preheat'],['ld','Loaded'],['lo','Lids off'],['ot','Out']];
function steps(){return STEPS.filter(function(s){return s.id!=='au'||S.auto})}
function tm(x){return new Date(x).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function wk(x){return new Date(x).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}
function du(a,b){if(!a||!b)return '';var m=Math.round((b-a)/60000);return m>=60?Math.floor(m/60)+' h '+m%60+' min':m+' min'}
var beeped=0;
function tick(){var b=$('tbar'),t=run().tm;if(!b)return;if(!t){b.style.display='none';return}
 var d=Math.round((t.end-Date.now())/1000);b.style.display='flex';b.className='tbar'+(d<=0?' due':'');
 $('tt').textContent=d>0?t.label+' in '+Math.floor(d/60)+':'+p2(d%60):t.label+' — now!';
 if(d<=0&&d>-60&&beeped!==t.end){beeped=t.end;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},700)}catch(e){}}}
